version: 2
updates:
  # NPM Dependencies for SortVision application
  - package-ecosystem: "npm"
    directory: "/SortVision"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "07:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: "scope"
    
    pull-request-branch-name:
      separator: "/"
    
    reviewers:
      - "alienx5499"
    
    assignees:
      - "alienx5499"
    
    labels:
      - "dependencies"
      - "automated"
      - "npm"
    
    groups:
      # Consolidate production dependencies into a single monthly PR
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

      # Consolidate development dependencies into a single monthly PR
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    
    # Prevent automatic major version updates for critical packages
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "framer-motion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node-fetch"
        update-types: ["version-update:semver-major"]
    
    rebase-strategy: "auto"
    target-branch: "main"
  
  # GitHub Actions Workflow Dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 2
    
    commit-message:
      prefix: "ci"
      include: "scope"
    
    labels:
      - "github-actions"
      - "ci-cd"
      - "automated"
    
    reviewers:
      - "alienx5499"
    
    groups:
      # Consolidate all GitHub Actions updates into a single monthly PR
      all-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    
    # Prevent major updates for critical actions
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-node"
        update-types: ["version-update:semver-major"]
    
    target-branch: "main"

# Enable beta ecosystems for latest features
enable-beta-ecosystems: true

